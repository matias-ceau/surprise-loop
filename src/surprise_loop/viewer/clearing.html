<style>
  /* ---------- the clearing, shared by the lens page and the film ---------- */
  :root {
    --bg: #12110d;
    --panel: #1a1914;
    --ink: #ece6d6;
    --soft: #c9c2b0;
    --dim: #8b8576;
    --rule: #2d2b24;
    --accent: #e0b86f;
    --relight: .6s;
    --arrive: .9s;
    --serif: Georgia, "Iowan Old Style", "Palatino Linotype", Palatino, "Times New Roman", serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 var(--serif);
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  .head { margin: 0 0 10px; display: flex; justify-content: space-between; align-items: baseline;
    gap: 12px; font: 11px/1 var(--mono); letter-spacing: .2em; text-transform: uppercase;
    color: var(--dim); font-weight: normal; }
  .head b { color: var(--ink); font-weight: normal; }
  .frame { position: relative; border-radius: 6px; overflow: hidden; background: #000;
    box-shadow: 0 0 0 1px #000, 0 18px 40px -18px #000; }
  .frame svg { display: block; width: 100%; height: auto; }
  .frame svg .p { transition: fill var(--relight) ease, stroke var(--relight) ease,
    opacity var(--relight) ease, filter var(--relight) ease, stop-color var(--relight) ease,
    transform var(--relight) ease; }
  .instant .p, .instant .s { transition: none !important; animation: none !important; }

  .lens { margin: 18px 2px 0; font-size: 19px; line-height: 1.55; color: var(--ink);
    text-wrap: pretty; }
  .s { cursor: pointer; border-radius: 3px; padding: 1px 0; box-decoration-break: clone;
    -webkit-box-decoration-break: clone; transition: background .2s, color .2s;
    background-image: linear-gradient(currentColor, currentColor); background-size: 0 1px;
    background-repeat: no-repeat; background-position: 0 100%; }
  .s:focus-visible { outline: 1px dotted var(--accent); outline-offset: 2px; }
  .s:hover { background-color: #ffffff10; }
  .s.opening { color: var(--soft); }
  .s.bodyline { font-style: italic; }
  .s.surprise { color: var(--accent); }
  .s.chosen { background-color: #e0b86f2e; }
  .s.fresh { animation: arrive var(--arrive) ease; }
  @keyframes arrive { from { opacity: 0; filter: blur(3px); } to { opacity: 1; filter: none; } }

  .why { margin: 14px 0 0; padding: 12px 14px; border-left: 2px solid var(--rule);
    background: var(--panel); font: 12.5px/1.6 var(--mono); color: var(--soft);
    border-radius: 0 4px 4px 0; }
  .why .title { color: var(--ink); font: italic 15px/1.4 var(--serif); margin-bottom: 4px; }
  .why .muted { color: var(--dim); }
  .why .nums { display: flex; flex-wrap: wrap; gap: 2px 18px; }
  .why .nums b { color: var(--ink); font-weight: normal; }
  .why .bar { position: relative; height: 6px; margin: 9px 0 3px; border-radius: 3px; max-width: 320px; }
  .why .bar i { position: absolute; top: -4px; width: 2px; height: 14px; background: var(--ink);
    margin-left: -1px; }
  .why .ends { display: flex; justify-content: space-between; max-width: 320px; font-size: 10.5px;
    color: var(--dim); }
</style>
<script>
"use strict";
/* ---------- colour: one continuous scale, bad to good for this body ---------- */
const BAD_SOFT = "#dc8a4c", BAD_DEEP = "#a52f1d";
const MIDDLE = "#cdc4aa";           /* neither good nor bad */
const GOOD_SOFT = "#a7cfa6", GOOD_DEEP = "#2e8d89";
const PAPER = "#d8d1bf";            /* what an unnoticed thing fades toward */
const NIGHT = "#141a18";            /* darkens the scale for dark things (shade) */
const DUSK = "#4f566c";             /* the low light of early morning and evening */
const DAWN_LOW = "#cdbcc6", EVENING_LOW = "#d9b48c";   /* the horizon at either end of the day */
const VALUE_SCALE = 1.6;            /* a value this large is most of the way along the scale */
const FADE = 0.74;                  /* how far an unnoticed thing fades */
const UNNOTICED_OPACITY = 0.2;      /* for line work: birds, breeze, outlines */

function hex(c) { return [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16)); }
function rgb(a) { return "rgb(" + a.map(v => Math.round(v)).join(",") + ")"; }
function mixA(a, b, k) { return a.map((v, i) => v + (b[i] - v) * k); }
function mix(a, b, k) { return rgb(mixA(hex(a), hex(b), Math.max(0, Math.min(1, k)))); }
function toHex(s) {
  const m = s.match(/\d+/g).map(Number);
  return "#" + m.map(v => v.toString(16).padStart(2, "0")).join("");
}
function lean(value) { return Math.tanh(value / VALUE_SCALE); }   /* -1 bad .. +1 good */
function scaleColour(t) {
  /* five stops, continuous through the middle: deep bad, bad, neither, good, deep good */
  const k = Math.min(1, Math.abs(t));
  const [soft, deep] = t < 0 ? [BAD_SOFT, BAD_DEEP] : [GOOD_SOFT, GOOD_DEEP];
  return k < 0.5 ? mix(MIDDLE, soft, 2 * k) : mix(soft, deep, 2 * k - 1);
}
/* a thing's own colour, pulled toward the scale as far as its value leans, then faded if unnoticed */
function tint(base, value, noticed, opts) {
  const o = opts || {};
  const t = lean(value);
  let target = toHex(scaleColour(t));
  if (o.depth) target = toHex(mix(target, NIGHT, o.depth));
  let c = toHex(mix(base, target, Math.abs(t) * (o.reach === undefined ? 0.92 : o.reach)));
  if (!noticed) c = toHex(mix(c, PAPER, FADE));
  return c;
}
function scaleGradient() {
  const stops = [];
  for (let i = 0; i <= 20; i++) {
    const t = -1 + i / 10;
    stops.push(scaleColour(t) + " " + (i * 5) + "%");
  }
  return "linear-gradient(90deg," + stops.join(",") + ")";
}

/* ---------- the picture: one fixed side-on view of the clearing ---------- */
/* west (the stream) is on the left, the oak on the right; the sun crosses from right to left */
const SPOTS = {
  stream: { x: 116, y: 262 }, meadow: { x: 232, y: 270 }, oak: { x: 336, y: 266 },
};
const DAY_FROM = 360, DAY_TO = 1200;  /* the arc of the sun across the picture, in minutes */
const PLACE_NAMES = {
  meadow: "the middle of the clearing", oak: "under the oak", stream: "the bank of the stream",
};
const NAMES = {
  air: "the air", cool_air: "the cool air", sun: "the sun", shade: "the oak's shade",
  no_seat: "no seat here", log: "the log, in shade", log_sun: "the log, in the sun",
  oak_shade: "the oak's shade", oak_shade_far: "the oak's shade, far off",
  oak_log_shaded: "the shaded log under the oak", oak_log_sunlit: "the log under the oak, sunlit",
  water: "the water, running full", trickle: "a trickle of water", stream: "the stream",
  meadow_sun: "the sunny meadow", breeze: "the breeze", birdsong: "the birds",
};
/* which facts feed which part of the picture; the first one present is used */
const ROLES = {
  sky: ["air", "cool_air"], sun: ["sun"], meadowsun: ["meadow_sun"],
  stream: ["water", "trickle", "stream"],
  oak: ["shade", "oak_shade", "oak_shade_far", "oak_log_shaded", "oak_log_sunlit"],
  log: ["log", "log_sun", "oak_log_shaded", "oak_log_sunlit"],
  seat: ["no_seat"], breeze: ["breeze"], birds: ["birdsong"],
};
const SUNLIT_LOG = ["log_sun", "oak_log_sunlit"];

function sunAt(minute) {
  const f = Math.max(0, Math.min(1, (minute - DAY_FROM) / (DAY_TO - DAY_FROM)));
  return { x: 470 - 440 * f, y: 158 - 118 * Math.pow(Math.sin(Math.PI * f), 0.7) };
}
function daylight(minute) {
  /* full light from mid-morning to late afternoon, dimmer toward 06:00 and 20:00 */
  const rise = (minute - DAY_FROM + 30) / 180, fall = (DAY_TO + 30 - minute) / 180;
  return Math.max(0, Math.min(1, rise, fall));
}

function figureSvg(cls) {
  return `<g class="${cls}">
      <ellipse class="shadow" cx="0" cy="0" rx="15" ry="4" fill="#000" opacity="0.28"/>
      <g class="pose">
        <path class="torso" d="M-9 -1 C-12 -26 -8 -40 0 -46 C8 -40 12 -26 9 -1 Z"/>
        <circle class="headc" cx="0" cy="-56" r="8"/>
      </g>
    </g>`;
}

function sceneSvg(id) {
  return `
<svg viewBox="0 0 480 300" role="img" aria-label="the clearing as this body lives it">
  <defs>
    <linearGradient id="${id}-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" class="p" data-k="skyTop"/>
      <stop offset="1" class="p" data-k="skyLow"/>
    </linearGradient>
    <radialGradient id="${id}-glow">
      <stop offset="0" class="p" data-k="glowIn"/>
      <stop offset="1" class="p" data-k="glowOut" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="${id}-ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a3a578"/>
      <stop offset="1" stop-color="#7a7f55"/>
    </linearGradient>
    <radialGradient id="${id}-patch">
      <stop offset="0" class="p" data-k="sunpatchIn"/>
      <stop offset="1" class="p" data-k="sunpatchOut" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="${id}-vig" cx="0.5" cy="0.6" r="0.78">
      <stop data-k="vigIn" offset="0.7" stop-color="#000" stop-opacity="0"/>
      <stop data-k="vigOut" offset="1" stop-color="#000"/>
    </radialGradient>
    <filter id="${id}-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
    <filter id="${id}-haze" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
  </defs>

  <g class="p" data-role="sky">
    <rect width="480" height="196" fill="url(#${id}-sky)"/>
    <g class="p" data-k="shimmer" fill="none" stroke-width="1.6" stroke-linecap="round">
      <path d="M20 132 q30 -7 60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0"/>
      <path d="M0 150 q30 -6 60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0"/>
      <path d="M30 168 q30 -5 60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0"/>
    </g>
  </g>

  <g class="p" data-role="sun">
    <g class="p" data-k="rays" stroke-linecap="round">
      <path data-k="ray0" stroke-width="22"/>
      <path data-k="ray1" stroke-width="12"/>
      <path data-k="ray2" stroke-width="10"/>
    </g>
    <g class="p" data-k="sunPos">
      <circle class="p" data-k="glow" cx="0" cy="0" r="60" fill="url(#${id}-glow)"/>
      <circle class="p" data-k="disc" cx="0" cy="0" r="17"/>
    </g>
  </g>

  <path d="M0 176 q16 -26 34 -6 q14 -34 40 -4 q20 -22 38 -2 q22 -40 50 -2 q18 -24 36 0 q20 -30 44 -2 q24 -36 52 0 q18 -22 36 -2 q22 -34 48 0 q18 -24 38 -2 q20 -30 44 0 q12 -14 20 -6 V200 H0Z"
        fill="#5f6d4f" opacity="0.55"/>
  <rect y="190" width="480" height="110" fill="url(#${id}-ground)"/>

  <g class="p" data-role="meadowsun">
    <ellipse class="p" data-k="sunpatch" cx="232" cy="262" rx="92" ry="22" fill="url(#${id}-patch)"/>
  </g>

  <g class="p" data-role="stream">
    <path class="p" data-k="water" d="M0 214 C44 208 84 220 96 238 C106 256 64 276 0 290 Z"/>
    <path class="p" data-k="trickle" d="M0 236 C30 232 62 238 76 246 C84 252 52 262 0 268 Z"/>
    <path class="p" data-k="bank" fill="none" stroke-width="3"
          d="M0 214 C44 208 84 220 96 238 C106 256 64 276 0 290"/>
    <g class="p" data-k="glints" stroke-width="2" stroke-linecap="round">
      <path d="M12 232 h20"/><path d="M38 244 h26"/><path d="M10 258 h18"/><path d="M34 270 h20"/>
    </g>
  </g>

  <g class="p" data-role="oak">
    <ellipse class="p" data-k="pool" cx="372" cy="262" rx="78" ry="17"/>
    <path class="p" data-k="trunk" d="M364 262 C366 230 364 196 360 166 L380 166 C376 196 376 230 382 262 Z"/>
    <g class="p" data-k="crown">
      <ellipse cx="372" cy="128" rx="70" ry="46"/>
      <ellipse cx="330" cy="146" rx="38" ry="28"/>
      <ellipse cx="414" cy="146" rx="40" ry="28"/>
      <ellipse cx="368" cy="98" rx="44" ry="30"/>
    </g>
  </g>

  <g class="p" data-role="log">
    <path class="p" data-k="logshaft" d="M424 172 L446 172 L452 254 L404 254 Z" opacity="0"/>
    <rect class="p" data-k="logbody" x="394" y="248" width="54" height="12" rx="6"/>
    <ellipse class="p" data-k="logend" cx="400" cy="254" rx="4" ry="5.2"/>
    <ellipse class="p" data-k="logspot" cx="428" cy="250" rx="16" ry="3" opacity="0"/>
  </g>

  <g class="p" data-role="seat">
    <g data-k="seatPos">
      <ellipse class="p" data-k="patch" cx="0" cy="0" rx="52" ry="11"/>
      <g class="p" data-k="wanted" fill="none" stroke-width="1.8" stroke-dasharray="4 4" stroke-linecap="round">
        <rect x="20" y="-18" width="44" height="12" rx="6"/>
        <path d="M26 -6 v8 M58 -6 v8"/>
      </g>
    </g>
  </g>

  <g class="p" data-role="breeze" fill="none" stroke-width="1.6" stroke-linecap="round">
    <g class="p" data-k="wind">
      <path d="M52 110 q22 -9 44 0 q12 6 24 0"/>
      <path d="M84 124 q16 -6 32 0 q9 4 18 0"/>
      <path d="M300 206 q20 -8 40 0 q11 5 22 0"/>
      <path d="M180 196 q14 -5 28 0 q8 4 16 0"/>
    </g>
  </g>

  <g class="p" data-role="birds" fill="none" stroke-width="1.7" stroke-linecap="round">
    <g class="p" data-k="birds">
      <path d="M172 58 q7 -8 14 0 q7 -8 14 0"/>
      <path d="M292 72 q5 -6 10 0 q5 -6 10 0"/>
      <path d="M426 40 q6 -7 12 0 q6 -7 12 0"/>
      <path d="M60 46 q5 -6 10 0 q5 -6 10 0"/>
    </g>
  </g>

  <rect class="p" data-k="dusk" width="480" height="300" fill="${DUSK}" opacity="0" pointer-events="none"/>

  <g data-k="ghostAt" opacity="0">
    <g data-k="ghostTint" filter="url(#${id}-haze)">${figureSvg("ghost")}</g>
  </g>
  <path data-k="tether" fill="none" stroke-width="2.6" stroke-dasharray="3 5" stroke-linecap="round" opacity="0"/>
  <g data-k="dust" fill="none" stroke="#e9dfc6" stroke-width="1.4" stroke-linecap="round" opacity="0">
    <path d="M-20 -2 q-6 -6 -12 -4"/><path d="M-14 -8 q-4 -8 -2 -14"/><path d="M14 -4 q8 -6 14 -2"/>
  </g>
  <g data-k="figAt">${figureSvg("figure")}
    <circle data-k="core" cx="0" cy="-30" r="5" opacity="0"/>
  </g>
  <circle data-k="ringShade" cx="0" cy="0" r="10" fill="none" stroke="#000" opacity="0"/>
  <circle data-k="ring" cx="0" cy="0" r="10" fill="none" opacity="0"/>

  <rect width="480" height="300" fill="url(#${id}-vig)" pointer-events="none"/>
</svg>`;
}

function setFill(el, c) { el.style.fill = c; }
function setStroke(el, c) { el.style.stroke = c; }

/* the facts of a felt scene, by part of the picture */
function factsByRole(entry) {
  const byName = {};
  entry.facts.forEach(f => { byName[f.name] = f; });
  const out = {};
  Object.keys(ROLES).forEach(role => {
    const name = ROLES[role].find(n => byName[n]);
    out[role] = name ? byName[name] : null;
  });
  return out;
}

/* paint the clearing as a felt scene: noticed things lit, the rest faded toward the paper, every
   colour on the one scale; `place` is where the scene is read from, `minute` sets the hour */
function paintScene(root, entry, arousal, opts) {
  const o = opts || {};
  const place = o.place || entry.place || "meadow";
  const minute = o.minute === undefined ? 780 : o.minute;
  const q = k => root.querySelector(`[data-k="${k}"]`);
  const role = factsByRole(entry);
  const on = r => role[r] ? role[r].noticed : false;
  const val = r => role[r] ? role[r].value : 0;
  const bad = r => Math.max(0, -lean(val(r)));
  const good = r => Math.max(0, lean(val(r)));
  const light = daylight(minute);

  /* unnoticed or absent things also lose their edges */
  root.querySelectorAll("[data-role]").forEach(g => {
    const r = g.getAttribute("data-role");
    g.style.filter = on(r) || r === "sky" ? "none" : `url(#${root.dataset.id}-soft)`;
  });

  /* the air: the whole sky's tint, dimmed at the ends of the day, and a shimmer when bad */
  const dim = 0.55 * (1 - light);
  q("skyTop").style.stopColor = tint(toHex(mix("#a9bcc0", DUSK, dim)), val("sky"), on("sky"), { reach: 0.85 });
  const lowLight = minute < (DAY_FROM + DAY_TO) / 2 ? DAWN_LOW : EVENING_LOW;
  q("skyLow").style.stopColor = tint(toHex(mix("#e6dfcc", lowLight, dim * 1.4)), val("sky"), on("sky"), { reach: 0.6 });
  setStroke(q("shimmer"), tint("#f4e7c8", val("sky"), on("sky"), { reach: 0.4 }));
  q("shimmer").style.opacity = (0.08 + 0.6 * bad("sky")) * (on("sky") ? 1 : 0.4);
  q("dusk").style.opacity = String(0.32 * (1 - light));

  /* the sun: where the hour puts it; its glow widens as it presses on the body, beams reach down
     toward the body when it is bad */
  const sun = sunAt(minute), feet = SPOTS[place] || SPOTS.meadow;
  q("sunPos").style.transform = `translate(${sun.x}px, ${sun.y}px)`;
  [-26, 0, 22].forEach((dx, i) => {
    q("ray" + i).setAttribute("d", `M${sun.x} ${sun.y + 6} L${feet.x + dx} 286`);
  });
  const sunBad = bad("sun"), sunOn = on("sun");
  setFill(q("disc"), sunOn ? toHex(mix("#fff6df", "#fffdf7", sunBad)) : toHex(mix("#fbf1d3", PAPER, FADE)));
  q("glowIn").style.stopColor = sunOn ? toHex(mix("#fff1c4", "#fff8ea", sunBad)) : PAPER;
  q("glowOut").style.stopColor = tint("#f7dd96", val("sun"), sunOn, { reach: 0.9 });
  q("glow").setAttribute("r", String(44 + 60 * Math.abs(lean(val("sun")))));
  q("glow").style.opacity = role.sun ? (sunOn ? 0.75 + 0.25 * sunBad : 0.35) : 0.18;
  q("disc").style.opacity = role.sun ? 1 : 0.45;
  setStroke(q("rays"), tint("#fff1d0", val("sun"), sunOn, { reach: 0.3 }));
  q("rays").style.opacity = sunOn ? 0.05 + 0.22 * sunBad : 0.03 * (role.sun ? 1 : 0);

  /* the sunny meadow, seen from elsewhere: a pool of light on the open ground */
  q("sunpatchIn").style.stopColor = tint("#fff0c0", val("meadowsun"), on("meadowsun"), { reach: 0.8 });
  q("sunpatchOut").style.stopColor = tint("#f2d68c", val("meadowsun"), on("meadowsun"), { reach: 0.8 });
  q("sunpatch").style.opacity = role.meadowsun ? (on("meadowsun") ? 0.85 : 0.35) : 0;

  /* the stream: full water or a trickle, its glints when it would help */
  const trickle = role.stream && role.stream.name === "trickle";
  const streamOn = on("stream"), streamSeen = role.stream ? 1 : 0.5;
  setFill(q("water"), tint("#6f9db0", val("stream"), streamOn, { reach: 0.55 }));
  setFill(q("trickle"), tint("#6f9db0", val("stream"), streamOn, { reach: 0.55 }));
  q("water").style.opacity = trickle ? 0.12 : streamSeen;
  q("trickle").style.opacity = trickle ? 1 : 0;
  setStroke(q("bank"), tint("#c9d8cf", val("stream"), streamOn, { reach: 0.7 }));
  q("bank").style.opacity = trickle ? 0.35 : streamSeen;
  setStroke(q("glints"), streamOn ? "#f2fbff" : toHex(mix("#f2fbff", PAPER, FADE)));
  q("glints").style.opacity = trickle ? 0 : streamOn ? 0.45 + 0.5 * good("stream") : 0.3;

  /* the oak: its pool of shade carries the value, the tree follows a little */
  setFill(q("pool"), tint("#4a5545", val("oak"), on("oak"), { depth: 0.45 }));
  setFill(q("trunk"), tint("#4c3c2b", 0, on("oak")));
  setFill(q("crown"), tint("#5f7f52", val("oak"), on("oak"), { reach: 0.45, depth: 0.15 }));

  /* the log under the oak: in shade or with the sun on it, if this body knows */
  const sunlit = role.log && SUNLIT_LOG.includes(role.log.name);
  setFill(q("logbody"), tint("#6b5640", val("log"), on("log"), { reach: 0.8 }));
  setFill(q("logend"), tint("#8c7558", val("log"), on("log"), { reach: 0.5 }));
  setFill(q("logshaft"), tint("#fff1c8", val("log"), on("log"), { reach: 0.4 }));
  setFill(q("logspot"), "#fff4d6");
  q("logshaft").style.opacity = sunlit ? (on("log") ? 0.32 : 0.12) : 0;
  q("logspot").style.opacity = sunlit ? (on("log") ? 0.7 : 0.25) : 0;
  root.querySelector('[data-role="log"]').style.opacity = role.log ? 1 : 0.3;

  /* no seat: bare ground at the body's feet, and the dotted outline of a seat wanted and absent */
  q("seatPos").setAttribute("transform", `translate(${feet.x} ${feet.y})`);
  setFill(q("patch"), tint("#b6a37a", val("seat"), on("seat"), { reach: 0.75 }));
  q("patch").style.opacity = role.seat ? 1 : 0;
  setStroke(q("wanted"), tint("#3a2a1e", val("seat"), on("seat"), { reach: 0.6, depth: 0.2 }));
  q("wanted").style.opacity = on("seat") ? Math.min(1, 1.6 * bad("seat")) : 0;

  /* the breeze and the birds: line work, present at full strength or barely */
  setStroke(q("wind"), tint("#f6f4ec", val("breeze"), on("breeze"), { reach: 0.7 }));
  q("wind").style.opacity = strengthOf(on("breeze"));
  setStroke(q("birds"), tint("#2f2a24", val("birds"), on("birds")));
  q("birds").style.opacity = on("birds") ? 0.9 : 0.35;

  if (o.fadeMs) fadeArousal(root, arousal, o.fadeMs);
  else setArousal(root, arousal, 0);
  placeFigure(root, feet.x, feet.y, {});
}
function strengthOf(noticed) { return noticed ? 1 : UNNOTICED_OPACITY; }

/* arousal closes the frame; `breath` (-1..1) lets it breathe */
function setArousal(root, arousal, breath) {
  const a = Math.max(0, Math.min(1, arousal));
  root.shownArousal = a;
  const b = breath || 0;
  root.querySelector('[data-k="vigIn"]').setAttribute("offset", String(0.92 - 0.72 * a - 0.04 * a * b));
  root.querySelector('[data-k="vigOut"]').style.stopOpacity = String(0.22 + 0.7 * a + 0.05 * b);
}

/* move the frame from the arousal it shows to `target` over `ms`, for a page that does not
   drive the frame itself on every animation frame */
function fadeArousal(root, target, ms) {
  const from = root.shownArousal === undefined ? target : root.shownArousal;
  const start = performance.now();
  cancelAnimationFrame(root.fading || 0);
  const step = now => {
    const k = Math.max(0, Math.min(1, (now - start) / ms));
    setArousal(root, from + (target - from) * k * k * (3 - 2 * k), 0);
    if (k < 1) root.fading = requestAnimationFrame(step);
  };
  root.fading = requestAnimationFrame(step);
}

/* the creature, standing at x, feet on y; pose: sit, kneel (a stumble) and lie (collapsed), 0..1 */
const FIGURE_INK = "#2b2520";
function placeFigure(root, x, y, pose) {
  const fig = root.querySelector('[data-k="figAt"]');
  fig.setAttribute("transform", `translate(${x.toFixed(1)} ${y.toFixed(1)})`);
  fig.querySelectorAll(".torso, .headc").forEach(el => { el.style.fill = FIGURE_INK; });
  fig.querySelector(".pose").setAttribute("transform", poseTransform(pose));
}
function poseTransform(pose) {
  const sit = pose.sit || 0, kneel = pose.kneel || 0, lie = pose.lie || 0;
  /* lying: turned flat on the ground; kneeling: pitched forward and down */
  const angle = 88 * lie + 34 * kneel;
  const drop = 4 * lie + 6 * kneel;
  const squash = 1 - 0.22 * sit - 0.12 * kneel;
  return `translate(0 ${drop.toFixed(1)}) rotate(${angle.toFixed(1)} 0 -4) scale(1 ${squash.toFixed(3)})`;
}

/* ---------- the numbers behind a sentence ---------- */
const FELT_ZERO = 0.005;            /* below this a felt strength shows as 0.00 */
const CHANNEL_WORDS = {
  heat: ["too cool", "too hot"], water: ["over-full", "thirsty"], energy: ["restless", "tired"],
};
function fmt(x, d) {
  const s = Math.abs(x).toFixed(d);
  return (x < 0 && Number(s) !== 0 ? "−" : "") + s;
}
function signed(x, d) { return (x > 0 ? "+" : "") + fmt(x, d); }
function ordinal(n) {
  const ends = ["th", "st", "nd", "rd"], v = n % 100;
  return n + (ends[(v - 20) % 10] || ends[v] || ends[0]);
}

function factWhy(entry, name) {
  const i = entry.facts.findIndex(f => f.name === name);
  const f = entry.facts[i];
  const t = lean(f.value);
  const verdict = f.sign === "+" ? "good for this body" : f.sign === "-" ? "bad for this body" : "neither good nor bad";
  const state = f.noticed
    ? `noticed, ${ordinal(i + 1)} of ${entry.facts.length} by weight`
    : `<span class="muted">not noticed now, ${ordinal(i + 1)} of ${entry.facts.length} by weight</span>`;
  return `<div class="title">${NAMES[f.name] || f.name}</div>
    <div>${state}</div>
    <div class="nums"><span>weight <b>${f.weight.toFixed(3)}</b></span>
      <span>value <b>${signed(f.value, 2)}</b></span>
      <span>sign <b>${f.sign}</b></span><span>grade <b>${f.grade}</b></span></div>
    <div class="bar" style="background:${scaleGradient()}"><i style="left:${(50 + 50 * t).toFixed(1)}%"></i></div>
    <div class="ends"><span>bad</span><span>${verdict}</span><span>good</span></div>`;
}

function bodyWhy(entry, channel) {
  const line = entry.body.find(b => b.channel === channel);
  const felt = entry.felt[channel];
  const words = CHANNEL_WORDS[channel] || ["", ""];
  /* at a strength that shows as zero there is no direction to name */
  const way = Math.abs(felt) < FELT_ZERO ? "where this body wants it" : felt > 0 ? words[1] : words[0];
  const head = `<div class="title">the body: ${channel}</div>`;
  const state = line ? `speaks, at grade ${Math.abs(line.grade)}`
    : `<span class="muted">silent now</span>`;
  return head + `<div>${state}</div>
    <div class="nums"><span>felt strength <b>${signed(felt, 2)}</b> (${way})</span>
      ${line ? `<span>grade <b>${line.grade}</b></span>` : ""}</div>`;
}

function feltNums(entry) {
  return Object.keys(entry.felt).map(c => `<span>${c} <b>${signed(entry.felt[c], 2)}</b></span>`).join("");
}

function openingWhy(entry, place) {
  const noticed = entry.facts.filter(f => f.noticed).length;
  return `<div class="title">${PLACE_NAMES[place] || place}</div>
    <div>${noticed} of ${entry.facts.length} facts noticed; ${entry.body.length} body line${entry.body.length === 1 ? "" : "s"}</div>
    <div class="nums"><span class="muted">felt strength</span>${feltNums(entry)}</div>`;
}

/* a sentence the person can open: by pointer, or by Tab and then Enter or Space */
function sentenceSpan(cls, key, text) {
  const span = document.createElement("span");
  span.className = cls;
  span.dataset.key = key;
  span.textContent = text;
  span.tabIndex = 0;
  span.setAttribute("role", "button");
  return span;
}
document.addEventListener("keydown", ev => {
  const s = ev.target;
  if (!(s instanceof HTMLElement) || !s.classList.contains("s")) return;
  if (ev.key !== "Enter" && ev.key !== " ") return;
  ev.preventDefault();
  const key = s.dataset.key, host = s.closest("section");
  s.click();
  /* the click redraws the sentences: keep the focus on the same one */
  const again = host && host.querySelector(`.s[data-key="${CSS.escape(key)}"]`);
  if (again) again.focus();
});

function idleWhy(entry) {
  const left = entry.facts.filter(f => !f.noticed).map(f => NAMES[f.name] || f.name);
  return `<div class="muted">Click a sentence for the numbers behind it.</div>
    <div>left unsaid: ${left.length ? left.join(", ") : "nothing"}</div>
    <div class="nums"><span class="muted">felt strength</span>${feltNums(entry)}</div>`;
}
</script>
