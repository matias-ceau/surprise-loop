# The plain creature of two_maps.yaml for one day of sixty ticks, with Deliberate and Appraise on
# a model. The model comes from SURPRISE_LOOP_MODEL.
name: pilot
seeds: [1]
ticks: 60
model: null
backends:
  deliberate: llm
  appraise: llm
world:
  layout:
    - "...#..~.."
    - ".F.#...T."
    - ".....P..."
    - "##..@..U."
    - "...T..F.."
    - ".~...#..B"
    - "....F#..."
  body:
    smell_chance: 0.7
    damp_chance: 0.7
agents:
  - name: plain
    temperament:
      presumes: {ground: 0.60, pleasant: 0.06, unpleasant: 0.05, obstacle: 0.12, food: 0.06, toxic: 0.03, water: 0.06, foul: 0.02}
      gain: {hunger: 1.0, thirst: 1.0, ache: 1.0, sickness: 1.0, unease: 1.0, pleasure: 1.0}
      noise: {hunger: 0.02, thirst: 0.02, ache: 0.02, sickness: 0.02, unease: 0.02, pleasure: 0.02}
      blur: 0.0
