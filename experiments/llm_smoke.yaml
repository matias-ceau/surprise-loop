# Smoke test for build step 5: one mid-range agent with every phase on the LLM, 40 ticks.
# The model comes from SURPRISE_LOOP_MODEL (e.g. openrouter:<id>); about 120 model calls.
# The trait_grid schedule shortened so that 40 ticks cross FR1 acquisition, progressive ratio and
# the FR1 re-baseline, and reach the start of extinction (re-entry only adds world steps).
name: llm_smoke
seeds: [1]
ticks: 40
world:
  active_lever: random
  reward_magnitude: 1.0
  schedule:
    - {kind: fixed_ratio, steps: 10, ratio: 1}
    - {kind: progressive_ratio, steps: 15, pr_start: 1, pr_increment: 2}
    - {kind: fixed_ratio, steps: 5, ratio: 1}
    - {kind: extinction, steps: 20}
agents:
  - name: baseline
    traits: {reward_sensitivity: 1.0, surprise_learning_rate: 0.5, mood_inertia: 0.5}
backends:
  appraise: llm
  deliberate: llm
  evaluate: llm
model: null
