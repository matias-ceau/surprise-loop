# llm_traits with longer PR and extinction phases, so the real model has room to quit.
# In llm_traits (75-step PR, 50-step extinction) the model never met the quit criterion in PR
# (every breakpoint censored at the phase length) and 5 of 8 extinction values were censored.
# Same profiles, seeds and ratios; PR 200 steps, extinction 150, so 375 world steps per run,
# about 1,150 model calls per run and 9,000 for the experiment. Run it with
#   surprise-loop experiment experiments/llm_traits_long.yaml --jobs 8
name: llm_traits_long
seeds: [1, 2]
ticks: null
world:
  active_lever: random
  reward_magnitude: 1.0
  schedule:
    - {kind: fixed_ratio, steps: 15, ratio: 1}
    - {kind: progressive_ratio, steps: 200, pr_start: 1, pr_increment: 2}
    - {kind: fixed_ratio, steps: 10, ratio: 1}
    - {kind: extinction, steps: 150}
agents:
  - name: baseline
    traits: {reward_sensitivity: 1.0, surprise_learning_rate: 0.5, mood_inertia: 0.5}
  - name: surprise_learning_rate_low
    traits: {reward_sensitivity: 1.0, surprise_learning_rate: 0.2, mood_inertia: 0.5}
  - name: surprise_learning_rate_high
    traits: {reward_sensitivity: 1.0, surprise_learning_rate: 0.8, mood_inertia: 0.5}
  - name: reward_sensitivity_high
    traits: {reward_sensitivity: 2.0, surprise_learning_rate: 0.5, mood_inertia: 0.5}
backends:
  appraise: llm
  deliberate: llm
  evaluate: llm
model: null
