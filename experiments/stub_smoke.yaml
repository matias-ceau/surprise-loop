# Smoke test for build step 3: one mid-range agent, every LLM phase stubbed, zero API calls.
# Runs 100 ticks through fixed ratio, progressive ratio and extinction: `surprise-loop run` this file.
name: stub_smoke
seeds: [1]
ticks: 100
world:
  active_lever: press_a
  reward_magnitude: 1.0
  schedule:
    - {kind: fixed_ratio, steps: 30, ratio: 1}
    - {kind: progressive_ratio, steps: 40, pr_start: 1, pr_increment: 2}
    - {kind: extinction, steps: 130}
agents:
  - name: baseline
    traits: {reward_sensitivity: 1.0, surprise_learning_rate: 0.5, mood_inertia: 0.5}
backends:
  appraise: stub
  deliberate: stub
  evaluate: stub
model: null
