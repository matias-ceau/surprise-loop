[project]
name = "surprise-loop"
version = "0.1.0"
description = "A prediction-error-driven LLM agent with a simulated body, in a small forest clearing."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "pydantic-ai>=2",
    "pyyaml",
]

[project.scripts]
surprise-loop = "surprise_loop.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
